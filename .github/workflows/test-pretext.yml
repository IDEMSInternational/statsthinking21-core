name: Test PreTeXt Book Build

on:
  # Run on pull requests targeting master to verify the book builds
  pull_request:
    branches:
      - master

# Cancel in-progress runs for the same PR when new commits are pushed
concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PreTeXt CLI
        run: |
          pip install -r pretext/requirements.txt

      - name: Seed Runestone services cache for offline builds
        run: |
          python - <<'PY'
          from pretext import resources
          cache_dir = resources.resource_base_path() / "rs_cache"
          cache_dir.mkdir(parents=True, exist_ok=True)
          cache_file = cache_dir / "rs_services.xml"
          if not cache_file.exists():
              cache_file.write_text(
                  "<all><js/><css/><cdn-url>https://runestone.academy/cdn/runestone/latest/</cdn-url><version>latest</version></all>",
                  encoding="utf-8",
              )
          PY

      - name: Build PreTeXt book (HTML)
        run: |
          cd pretext
          pretext build web
          # Verify build succeeded by checking if output exists
          if [ ! -d "output/web" ]; then
            echo "Build failed: output/web directory not created"
            exit 1
          fi
          echo "Build succeeded: output/web directory exists"
